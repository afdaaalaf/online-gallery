<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>New client link – afdal photography</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f7;color:#16181d;font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
  main{width:min(560px,90vw)}
  h1{font-weight:300;font-size:2rem;margin:0 0 .25rem;letter-spacing:-.02em}
  p{margin:0 0 1.5rem;color:#5b616b}
  input{width:100%;box-sizing:border-box;padding:.85rem 1rem;font:inherit;border:1px solid #c9ced6;border-radius:6px;background:#fff}
  button{margin-top:.75rem;padding:.8rem 1.4rem;font:inherit;color:#fff;background:#2438d6;border:0;border-radius:6px;cursor:pointer}
  #out{margin-top:1.5rem;word-break:break-all}
  :focus-visible{outline:2px solid #2438d6;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>New client link</h1>
  <p>Paste the Google Drive folder link. The folder must be shared as “Anyone with the link”.</p>
  <input id="src" placeholder="https://drive.google.com/drive/folders/…" autofocus>
  <button id="make">Create client link</button>
  <div id="out" hidden>
    <p id="msg"></p>
    <input id="link" readonly>
    <button id="copy">Copy link</button>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  $('make').onclick = () => {
    const m = $('src').value.match(/folders\/([\w-]+)|[?&]id=([\w-]+)/);
    $('out').hidden = false;
    if (!m) { $('msg').textContent = 'That doesn’t look like a Drive folder link.'; $('link').hidden = $('copy').hidden = true; return; }
    $('msg').textContent = 'Send this link to your client:';
    $('link').hidden = $('copy').hidden = false;
    $('link').value = `${location.origin}/?folder=${m[1] || m[2]}`;
  };
  $('copy').onclick = async () => { await navigator.clipboard.writeText($('link').value); $('copy').textContent = 'Copied'; };
</script>
</body>
</html>
